<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Vídeo · El sistema financiero español</title>
<style>
@font-face{font-family:Fraunces;src:url(../src/assets/fuentes/fraunces-normal-300-700-latin.woff2);font-weight:300 700}
@font-face{font-family:"IBM Plex Sans";src:url(../src/assets/fuentes/ibm-plex-sans-normal-latin.woff2);font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(../src/assets/fuentes/ibm-plex-mono-normal-500-latin.woff2);font-weight:500}
:root{--bg:#070b14;--bg3:#141c2d;--ink:#f1ebdf;--mut:#aab1be;--oro:#e0b25e;--oro2:#f2d48f;--c:#5cc6c1;--p:#e8789a;--b:#6fa9ea;--o:#ec9459;--g:#6ccf96;--v:#a796e8;--r:#e9725f;--y:#e8c062}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",sans-serif}
#st{position:relative;width:1280px;height:720px;background:radial-gradient(900px 500px at 50% 40%,#101a30,var(--bg))}
.esc{position:absolute;inset:0;opacity:0}
.tit{position:absolute;left:0;right:0;top:46px;text-align:center;font:500 44px Fraunces,serif;color:var(--oro2)}
.sub{position:absolute;left:90px;right:90px;bottom:42px;text-align:center;font-size:25px;line-height:1.4;color:var(--ink)}
.nodo{position:absolute;border:2px solid var(--oro);border-radius:16px;background:var(--bg3);display:flex;align-items:center;justify-content:center;text-align:center;font:500 22px "IBM Plex Sans";padding:10px;line-height:1.25}
.mono{font-family:"IBM Plex Mono",monospace}
.coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--oro2),var(--oro));box-shadow:0 0 12px #e0b25e88}
svg{position:absolute;inset:0}
</style></head><body><div id="st"></div>
<script src="datos.js"></script><script src="escenas.js"></script></body></html>
